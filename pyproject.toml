[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telco-analytics"
version = "0.1.0"
description = "Reusable data preparation and feature storage for TellCo user analysis"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "numpy",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "openpyxl",
    "joblib",
    "ipykernel",
]

[tool.setuptools.packages.find]
include = ["telco_analytics*"]